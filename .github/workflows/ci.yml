name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (GitHub Pages base path)
        env:
          BASE_PATH: /paradise-isle/
        run: npx vite build
      - name: Install browser interaction QA
        run: python -m pip install selenium==4.37.0
      - name: Accept workshop, session lifecycle and backup restore in Chromium
        run: |
          BASE_PATH=/paradise-isle/ npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/paradise-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/paradise-isle/ >/dev/null; then break; fi
            sleep 1
          done
          python tests/browser_workshop.py
          python tests/browser_lifecycle.py
      - name: Preserve browser interaction and session-regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradise-browser-chromium-proof
          path: |
            artifacts/workshop/
            artifacts/session-lifecycle/
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
